logging.level.root=INFO
http.request.url-expression=headers['x-url']
http.request.timeout=1000
http.request.http-method-expression='POST'
http.request.headers-expression={'Content-Type':headers['content-type']}
http.request.body-expression=payload
http.request.expected-response-type=java.lang.Void
http.request.reply-expression=statusCode
